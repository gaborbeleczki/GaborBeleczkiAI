<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Elli's English Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column on squared exercise-book paper; sticky stats bar on top, tab bar at the bottom, lessons open as a full-screen sheet. */
:root{
  --paper:#F6F9FF; --grid:rgba(64,104,196,.11); --card:#FFFFFF; --card-2:#EEF3FC; --line:#D5DFEF;
  --ink:#1D2742; --ink-soft:#56627F; --accent:#2B4BD8; --accent-deep:#1C35A8; --on-accent:#FFFFFF;
  --good:#17924F; --good-bg:#DCF5E6; --bad:#D2402F; --bad-bg:#FCE3DF; --gold:#E9A800; --flame:#F26B1D;
  --shadow:0 3px 0 rgba(29,39,66,.13);
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111726; --grid:rgba(130,160,255,.07); --card:#1A2234; --card-2:#222C42; --line:#2E3A56;
  --ink:#E7ECF8; --ink-soft:#A2ADC6; --accent:#7F97FF; --accent-deep:#5B74E6; --on-accent:#0D1330;
  --good:#45C983; --good-bg:#14352A; --bad:#FF7A6B; --bad-bg:#3B1E1C; --gold:#FFC93A; --flame:#FF9450;
  --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111726; --grid:rgba(130,160,255,.07); --card:#1A2234; --card-2:#222C42; --line:#2E3A56;
  --ink:#E7ECF8; --ink-soft:#A2ADC6; --accent:#7F97FF; --accent-deep:#5B74E6; --on-accent:#0D1330;
  --good:#45C983; --good-bg:#14352A; --bad:#FF7A6B; --bad-bg:#3B1E1C; --gold:#FFC93A; --flame:#FF9450;
  --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.chip-player{display:flex;align-items:center;gap:8px;background:var(--card-2);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-weight:800;min-width:0}
.chip-player .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:1.15rem}
.chip-player .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.stat{display:flex;align-items:center;gap:3px;font-weight:800;font-family:var(--f-display);font-size:1.05rem;padding:2px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.stat.fl{color:var(--flame)} .stat.fl.off{color:var(--ink-soft);filter:grayscale(1)}
.stat.xp{color:var(--gold)}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .5s}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem;flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 2px;border-radius:12px;font-weight:800;font-size:.72rem;color:var(--ink-soft)}
.tab .ti{font-size:1.35rem;line-height:1.2}
.tab[aria-current="page"]{color:var(--accent);background:var(--card-2)}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 18px;font-family:var(--f-display);font-weight:700;font-size:1.08rem;letter-spacing:.01em;
  background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep);box-shadow:0 4px 0 var(--accent-deep)}
.btn.good{background:var(--good);color:#fff;border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:7px 12px;font-size:.95rem;border-radius:11px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}

/* exam banner */
.banner{position:relative;overflow:hidden;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:16px 16px 16px 16px;box-shadow:0 4px 0 var(--accent-deep);margin-top:16px}
.banner h2{font-size:1.45rem}
.banner p{margin:6px 0 12px;opacity:.95}
.banner .btn{background:var(--card);color:var(--ink);border-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.banner .ele{position:absolute;right:-6px;bottom:-14px;font-size:5.2rem;opacity:.9;transform:rotate(-8deg);pointer-events:none}
.banner .row{position:relative;z-index:1}

/* book & unit path */
.book{margin-top:24px}
.book-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.book-cover{width:44px;height:58px;border-radius:6px 10px 10px 6px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:.8rem;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.15);flex:none;text-align:center;line-height:1}
.book-h h2{font-size:1.35rem}
.unit{margin-top:18px}
.unit-band{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 14px;color:var(--u-ink,#fff);background:var(--u);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit-band .un{font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.unit-band .h3{display:block;font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.15;text-wrap:balance}
.unit-band{font:inherit;cursor:pointer}
.unit-band .ui{font-size:1.9rem;margin-left:auto}
.unit-band .tag{display:inline-block;background:rgba(255,255,255,.92);color:#B3261E;border-radius:999px;padding:1px 9px;font-weight:800;font-size:.75rem;margin-left:6px;vertical-align:2px}
.trail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 4px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateX(var(--dx,0))}
.node{width:72px;height:66px;border-radius:50%;border:0;background:var(--u);color:var(--u-ink,#fff);font-size:1.7rem;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.node.done{filter:saturate(.85)}
.node.next{animation:bob 1.6s ease-in-out infinite}
.node-wrap .lbl{font-weight:800;font-size:.8rem;color:var(--ink-soft);text-align:center;max-width:9.5em;line-height:1.15}
.node-wrap .stars{font-size:.85rem;letter-spacing:1px;min-height:1em;color:var(--gold)}
.node-wrap .stars .off{color:var(--line)}
.start-tip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:800;font-size:.78rem;color:var(--accent);margin-bottom:4px;box-shadow:var(--shadow)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* lesson sheet */
.lesson{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:12px;padding-block:12px;width:100%}
.bar{flex:1;height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);border-radius:999px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-family:var(--f-display);font-weight:800;color:var(--flame);min-width:3.2em;text-align:right}
.l-body{flex:1;overflow-y:auto;padding-block:8px 20px}
.l-foot{border-top:2px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-foot .wrap{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.l-foot .fb{flex:1 1 220px;min-width:0;font-weight:800}
.l-foot .fb .big{font-family:var(--f-display);font-size:1.35rem;display:block}
.l-foot.ok{background:var(--good-bg);border-top-color:var(--good)} .l-foot.ok .fb{color:var(--good)}
.l-foot.no{background:var(--bad-bg);border-top-color:var(--bad)} .l-foot.no .fb{color:var(--bad)}
.l-foot .btn{flex:0 0 auto;min-width:9em}
.q-title{font-family:var(--f-display);font-size:1.45rem;font-weight:700;margin:6px 0 14px}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.bigpic{width:132px;height:132px;border-radius:22px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:4.6rem;box-shadow:var(--shadow);flex:none}
.bigpic svg{width:78%;height:78%}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:1.2rem;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.bubble.hu{font-weight:700}
.bubble .say{margin-left:8px}
.ele-sm{font-size:2.4rem}
.speak{border:2px solid var(--line);background:var(--card-2);border-radius:12px;padding:4px 10px;font-size:1.1rem;box-shadow:0 3px 0 var(--line)}
.speak.huge{width:110px;height:110px;border-radius:26px;font-size:3rem;background:var(--accent);color:var(--on-accent);border-color:var(--accent-deep);box-shadow:0 6px 0 var(--accent-deep)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 12px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--line);text-align:center;min-height:56px;overflow-wrap:anywhere}
.opt .pic{font-size:3.2rem;display:grid;place-items:center;height:76px}
.opt .pic svg{width:70px;height:70px}
.opt .k{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--card-2);box-shadow:0 4px 0 var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}

/* tiles */
.slots{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:8px 0 18px}
.slotgrp{display:flex;gap:5px}
.slot{width:40px;height:48px;border-radius:10px;border:0;border-bottom:3px solid var(--ink-soft);background:var(--card-2);font-family:var(--f-display);font-weight:800;font-size:1.5rem;display:grid;place-items:center;padding:0}
.slot.filled{border-bottom-color:var(--accent);background:var(--card)}
.slot.right{border-bottom-color:var(--good);color:var(--good)}
.slot.wrong{border-bottom-color:var(--bad);color:var(--bad)}
.answer-line{min-height:64px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-end;padding:6px 0 10px;margin-bottom:18px}
.answer-line.ok{border-bottom-color:var(--good)} .answer-line.bad{border-bottom-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.tile{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:800;font-size:1.15rem;box-shadow:0 3px 0 var(--line);min-width:44px}
.tile.letter{font-family:var(--f-display);font-size:1.45rem;width:46px;height:50px;padding:0}
.tile.used{visibility:hidden}
.typein{width:100%;font:inherit;font-family:var(--f-display);font-size:1.6rem;font-weight:700;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.04em}
.typein:focus{border-color:var(--accent);outline:none}
.hintline{font-family:var(--f-display);letter-spacing:.25em;color:var(--ink-soft);font-size:1.2rem;margin:4px 0 12px}

/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pair{min-height:64px}
.pair.gone{opacity:.25;pointer-events:none;border-color:var(--good)}

/* result */
.result{text-align:center;padding-top:20px}
.result .ele{font-size:5rem;display:inline-block;animation:hop .9s ease-in-out 2}
.result h2{font-size:2rem;margin:6px 0}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.res-stat{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:10px 4px}
.res-stat b{display:block;font-family:var(--f-display);font-size:1.5rem}
.res-stat span{font-size:.78rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}}

/* shuffle / words / games */
.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.pchip{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.pchip[aria-pressed="true"]{background:var(--u,var(--accent));color:var(--u-ink,#fff);border-color:transparent}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.scard .hint{font-size:2.2rem;height:52px;display:grid;place-items:center}
.scard .hint svg{width:44px;height:44px}
.scard .hint.txt{font-size:.95rem;font-weight:800;color:var(--ink-soft);height:auto;min-height:52px}
.scramble{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.18em;color:var(--accent);overflow-wrap:anywhere}
.reveal{font-weight:800;min-height:1.4em}
.reveal.hide{color:transparent;background:var(--card-2);border-radius:8px;width:80%}
.slist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.slist li{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.slist .scr{font-weight:800;color:var(--accent)}
.wcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:10px;min-width:0}
.wcard .wp{font-size:1.8rem;width:44px;height:44px;display:grid;place-items:center;flex:none}
.wcard .wp svg{width:36px;height:36px}
.wcard .wt{min-width:0;flex:1}
.wcard .wt b{display:block;overflow-wrap:anywhere}
.mast{display:flex;gap:2px;margin-top:3px}
.mast i{width:10px;height:6px;border-radius:3px;background:var(--line)}
.mast i.on{background:var(--good)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:3/4;max-width:100%;border-radius:14px;border:2px solid var(--line);background:var(--accent);color:var(--on-accent);font-weight:800;display:grid;place-items:center;font-size:1rem;box-shadow:0 4px 0 var(--accent-deep);padding:4px;overflow-wrap:anywhere;text-align:center}
.mcard.open{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.mcard.open .pv{font-size:2.3rem}
.mcard.open svg{width:48px;height:48px}
.mcard.got{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:none}
.game-card{display:flex;gap:14px;align-items:center}
.game-card .gi{font-size:2.6rem;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--card-2);flex:none}
.game-card .gt{flex:1;min-width:0}
.game-card h3{font-size:1.2rem}

/* exam */
.ex-sec{margin-top:16px}
.ex-sec h3{font-size:1.25rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex-sec h3 .pts{font-family:var(--f-body);font-size:.85rem;color:var(--ink-soft);font-weight:800}
.ex-item{border-top:2px dashed var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.ex-item:first-of-type{border-top:0}
.ex-item .qn{font-weight:800}
.dlg{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.dlg .who{font-family:var(--f-display);font-weight:800;font-size:1.2rem;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card-2)}
.dlg .ln{font-size:1.15rem;font-weight:700;line-height:2.1}
.blank{display:inline-block;min-width:4.6em;padding:0 8px;margin:0 3px;border:0;border-bottom:3px solid var(--ink-soft);background:var(--card-2);border-radius:8px 8px 2px 2px;font-weight:800;font-size:1.05rem;line-height:1.7;color:var(--accent);vertical-align:baseline}
.blank.active{border-bottom-color:var(--accent);background:var(--card);box-shadow:0 0 0 2px var(--accent)}
.blank.right{border-bottom-color:var(--good);color:var(--good)} .blank.wrong{border-bottom-color:var(--bad);color:var(--bad)}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-top:8px}
.wordbank .tile.spent{opacity:.35}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;vertical-align:middle;margin:0 4px}
.seg button{border:0;background:var(--card);padding:4px 12px;font-weight:800;font-size:1.05rem}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.right{border-color:var(--good)} .seg.wrong{border-color:var(--bad)}
.kidcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kid{border:2px solid var(--line);border-radius:16px;padding:10px;background:var(--card-2);text-align:center}
.kid .face{font-size:2.6rem}
.kid .tp{font-size:2.4rem}
.kid b{font-family:var(--f-display);font-size:1.25rem}
.fix{font-weight:800;color:var(--good);font-size:.95rem}
.fix.bad{color:var(--bad)}

function spellQ(s){const w=s.w,letters=[...w.en.replace(/[\s\-]/g,"")];let order=shuffle(letters.map((c,i)=>i));for(let k=0;k<6&&letters.length>2&&order.every((v,i)=>letters[v]===letters[i]);k++)order=shuffle(order);

  h+=(it.kind==="pickpic"&&g?(it.ok?'<span class="fix">✓</span>':'<span class="fix bad">✗ A zöld keretes kép a helyes.</span>'):mark(it))+'</div>'});h+='</div>';

 h+='<div class="key"><h1>Megoldókulcs</h1><h2>1.</h2><p>'+rows.map((r,i)=>(i+1)+". "+esc(r.w.en)).join(" · ")+'</p>'+(sents.length?'<h2>2.</h2><p>'+sents.map((x,i)=>(i+1)+". "+esc(x.s[0])).join("<br>")+'</p>':"")+'</div>';
 const txt="Szókeverő – "+unitLabel(u)+": "+u.title+"\n\n"+rows.map((r,i)=>(i+1)+". "+r.scr+"   ("+r.w.hu+")   ________").join("\n")+(sents.length?"\n\nMondatok:\n"+sents.map((x,i)=>(i+1)+". "+x.scr+"  ("+x.s[1]+")").join("\n"):"")+"\n\nMegoldás: "+rows.map(r=>r.w.en).join(", ");

 h+='<h2>B) His / her (8 pont)</h2><table><tr>'+[E.boy,E.girl].map(k=>'<td style="text-align:center"><span style="font-size:34px">'+k.face+'</span><br><b>'+esc(k.n)+'</b><br><span style="font-size:30px">'+picHTML(k.t.p)+'</span><br><span class="small">kedvenc játéka</span></td>').join("")+'</tr></table>';
 sec("B").forEach((it,n)=>{h+='<p><b>'+(n+1)+'.</b> ';if(it.kind==="seg")h+=it.kid.face+' '+esc(it.pre)+' <b>'+it.o.join(" / ")+'</b> '+esc(it.post)+' <span class="small">(húzd alá a jót)</span>';else if(it.kind==="type")h+=it.kid.face+' '+esc(it.q)+'<br>'+esc(it.pre)+' <span class="ln" style="min-width:110px"></span>'+esc(it.post);else h+=esc(it.q)+'<br><span style="font-size:16px;font-weight:700">'+esc(it.toks.join("  /  "))+'</span><br><span class="ln" style="min-width:90%"></span>';h+='</p>'});
 h+='<h2>C) Alakzatok – írd le a nevüket! (6 pont)</h2><table><tr>'+sec("C").map((it,n)=>'<td style="text-align:center"><b>'+(n+1)+'.</b><div class="svgp">'+it.html+'</div><span class="ln" style="min-width:80px"></span></td>').join("")+'</tr></table>';
 h+='<h2>D) Melléknevek és játékok (8 pont)</h2>';sec("D").forEach((it,n)=>{h+='<div class="box"><b>'+(n+1)+'.</b> ';if(it.kind==="pickpic")h+='Karikázd be a mondathoz illő képet: <i>'+esc(it.text)+'</i><br>'+it.o.map((o,i)=>'<span style="display:inline-block;margin:6px 16px 0 0;vertical-align:middle" class="svgp">'+(i+1)+') '+o.h+'</span>').join("");
  else if(it.kind==="order")h+='Írd le, mit látsz! <span class="svgp">'+it.html+'</span><br><span class="small">Segítség: '+esc(it.toks.join(" / "))+'</span><br><span class="ln" style="min-width:90%"></span>';else h+='Karikázd be a képhez illő mondatot! <span class="svgp">'+it.html+'</span><br>'+it.o.map(esc).join("<br>");h+='</div>'});
 h+='<div class="key"><h1>Megoldókulcs</h1><p><b>A)</b> '+sec("A").map(i=>esc(i.a)).join(", ")+'</p><p><b>B)</b> '+sec("B").map((i,n)=>(n+1)+". "+esc(i.kind==="order"?i.answer:i.a)).join(" · ")+'</p><p><b>C)</b> '+sec("C").map((i,n)=>(n+1)+". "+i.a).join(" · ")+'</p><p><b>D)</b> '+sec("D").map((i,n)=>(n+1)+". "+esc(i.kind==="pickpic"?(i.a+1)+". kép":i.kind==="order"?i.answer:i.a)).join(" · ")+'</p><p class="small">Pontozás: minden feladat 1 pont. Becsült jegy: 90%-tól 5, 75%-tól 4, 60%-tól 3, 45%-tól 2.</p></div>';
 const txt="Unit 2 próbadolgozat – megoldókulcs\nA) "+sec("A").map(i=>i.a).join(", ")+"\nB) "+sec("B").map(i=>i.kind==="order"?i.answer:i.a).join(" | ")+"\nC) "+sec("C").map(i=>i.a).join(", ")+"\nD) "+sec("D").map(i=>i.kind==="pickpic"?(i.a+1)+". kép":i.kind==="order"?i.answer:i.a).join(" | ");
 return {html:docHTML("Unit 2 próbadolgozat",h),txt}}
async function offerFile(name,{html,txt}){if(dl){try{await dl.save({filename:name,data:html});toast("Elmentve: "+name);return}catch(e){const c=e&&e.code;if(c==="declined")return;if(c==="rate_limited"){toast("Már nyitva van egy mentési ablak.");return}}}
 if(!window.claude){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return}catch(e){}}
 sheet('<h2>Feladatlap szövege</h2><p class="muted small">A letöltés itt nem érhető el. Másold ki a szöveget, és illeszd be egy dokumentumba nyomtatáshoz.</p><textarea class="copybox" id="copyBox" readonly>'+esc(txt)+'</textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-act="copyTxt">Másolás</button><button class="btn" data-act="closeSheet">Bezárás</button></div>')}

/* players & settings */
let newAv="🦒";
function openPlayers(){const p=P();sheet('<h2>Ki tanul most?</h2><div class="plist">'+Object.entries(S.players).map(([id,x])=>'<button class="prow" data-act="pickPlayer" data-id="'+id+'" aria-current="'+(id===S.cur)+'"><span class="av">'+x.av+'</span><span style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><br><span class="muted small">'+x.xp+' XP · 🔥 '+streakNow(x)+' nap</span></span>'+(id===S.cur?"✓":"")+'</button>').join("")+'</div>'+
 '<h3 style="margin:18px 0 8px">Új tanuló</h3><div class="stack" style="gap:10px"><div class="field"><label for="npName">Név</label><input id="npName" maxlength="20" placeholder="pl. Panni"></div><div class="avs" role="group" aria-label="Kép">'+AVATARS.map(a=>'<button data-act="pickAv" data-v="'+a+'" aria-pressed="'+(a===newAv)+'">'+a+'</button>').join("")+'</div><button class="btn primary" data-act="addPlayer">Hozzáadás</button></div>'+
 '<h3 style="margin:18px 0 8px">Beállítások – '+esc(p.name)+'</h3><div class="stack" style="gap:10px"><div class="field"><label for="rnName">Név</label><input id="rnName" maxlength="20" value="'+esc(p.name)+'"></div>'+
 '<div class="field"><label for="goalSel">Napi cél</label><select id="goalSel">'+[10,20,30,50].map(g=>'<option value="'+g+'"'+(g===p.goal?" selected":"")+'>'+g+' XP – '+({10:"laza",20:"normál",30:"komoly",50:"bajnok"})[g]+'</option>').join("")+'</select></div>'+
 '<div class="field"><label for="rateSel">Felolvasás</label><select id="rateSel"><option value="off"'+(!S.settings.voice?" selected":"")+'>Kikapcsolva</option>'+[[.75,"Lassú"],[.9,"Normál"],[1.05,"Gyors"]].map(([r,n])=>'<option value="'+r+'"'+(S.settings.voice&&Math.abs(S.settings.rate-r)<.01?" selected":"")+'>'+n+'</option>').join("")+'</select></div>'+
 '<p class="sync" data-sync></p><button class="btn primary" data-act="saveSettings">Kész</button></div>'+famHTML())}
function famHTML(){if(cloud.kind!=="supa")return"";return '<h3 style="margin:22px 0 6px">Családi kód</h3><p class="muted small" style="margin:0 0 8px">Ezzel a kóddal minden gyerek haladása megvan telefonon, tableten és gépen is. Írd fel valahová!</p>'+
 (cloud.code?'<div class="row"><span class="famcode">'+esc(cloud.code)+'</span><button class="btn sm" data-act="copyCode">Másolás</button></div>':'<div class="row"><button class="btn sm" data-act="makeCode">Kód létrehozása most</button></div>')+
 '<div class="stack" style="gap:8px;margin-top:12px"><div class="field"><label for="joinCode">Már van kódod egy másik eszközről?</label><input id="joinCode" placeholder="ABCDE-FGH23" autocapitalize="characters" autocomplete="off" maxlength="12"></div><button class="btn" data-act="joinCode">Csatlakozás</button><p class="muted small" style="margin:0">Csatlakozáskor a kódhoz mentett haladás töltődik be; az itteni, már gyakorló tanulók is megmaradnak.</p></div>'}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-go],[data-lesson]");if(!t)return;
 if(t.dataset.go){closeSheet();return go(t.dataset.go)}
 if(t.dataset.lesson){const l=LESSON[t.dataset.lesson];const items=l.kind==="words"?wordsLesson(l.words,l.unit):l.kind==="sents"?sentsLesson(l.unit):mixLesson(l.unit);return startLesson({items,title:unitLabel(l.unit)+" · "+l.name,lessonId:l.id,xp:l.kind==="mix"?15:10})}
 const a=t.dataset.act,id=t.dataset.id;
 switch(a){
 case"say":say(t.dataset.say);break;
 case"opt":if(L.mode==="speed")return speedAnswer(+t.dataset.i);if(L.state!=="ask")return;$$(".opt",body()).forEach(b=>b.setAttribute("aria-pressed","false"));t.setAttribute("aria-pressed","true");Q.sel=+t.dataset.i;if(t.dataset.say)say(t.dataset.say);ready(true);break;
 case"tile":tapTile(+t.dataset.i);break;case"slot":tapSlot(+t.dataset.i);break;
 case"tok":tapTok(+t.dataset.i);break;case"placed":tapPlaced(+t.dataset.k);break;
 case"pair":tapPair(t);break;
 case"quit":quitLesson();break;case"quitYes":closeSheet();closeLesson();break;
 case"closeSheet":closeSheet();break;
 case"sound":S.settings.sound=!S.settings.sound;commit();if(S.settings.sound)beep("tap");break;
 case"players":openPlayers();break;
 case"pickPlayer":S.cur=id;commit();closeSheet();EX=null;MEM=null;render();toast("Szia, "+P().name+"! "+P().av);break;
 case"pickAv":newAv=t.dataset.v;$$(".avs button").forEach(b=>b.setAttribute("aria-pressed",b===t?"true":"false"));break;
 case"addPlayer":{const n=($("#npName").value||"").trim().slice(0,20);if(!n){$("#npName").focus();toast("Írd be a nevet!");return}const nid="p"+Date.now().toString(36);S.players[nid]=newPlayer(n,newAv);S.cur=nid;commit();closeSheet();EX=null;MEM=null;render();toast("Szia, "+n+"! "+newAv);break}
 case"saveSettings":{const p=P();const n=($("#rnName").value||"").trim().slice(0,20);if(n)p.name=n;p.goal=+$("#goalSel").value||30;const r=$("#rateSel").value;if(r==="off")S.settings.voice=false;else{S.settings.voice=true;S.settings.rate=+r}commit();closeSheet();render();break}
 case"toggleUnit":{const u=t.dataset.u;UI.exp[u]=UI.exp[u]?0:1;saveUI();render();break}
 case"selUnit":UI.sel[t.dataset.for]=t.dataset.u;saveUI();if(t.dataset.for==="games")MEM=null;render();break;
 case"reshuffle":render();break;
 case"reveal":{const r=t.querySelector(".reveal");r.classList.toggle("hide");if(!r.classList.contains("hide"))say(t.dataset.say);break}
 case"revealSent":t.textContent=t.dataset.say;t.disabled=true;say(t.dataset.say);break;
 case"shufflePlay":{const u=UNIT[UI.sel.shuffle];let ws=shuffle(bkGroups(u).flatMap(g=>g.words));if(UI.bk.n)ws=ws.slice(0,UI.bk.n);
  const items=ws.map(w=>/\s/.test(w.en)&&w.en.replace(/[\s\-]/g,"").length>10?prodSpec(w):{type:"spell",w});if(UI.bk.s&&u.sents&&u.sents.length)items.push(...sample(u.sents,3).map(orderSpec));
  startLesson({items,title:"Betűkirakó · "+unitLabel(u)+" "+u.title,lessonId:"bk:"+u.id,xp:10});break}
 case"openBk":UI.sel.shuffle=UI.sel.games;UI.bk.g="all";saveUI();go("shuffle");break;
 case"sheet":{const u=UNIT[UI.sel.shuffle];offerFile("szokevero-"+u.title.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".html",shuffleSheet(u));break}
 case"copyTxt":{const box=$("#copyBox");const done=()=>toast("Kimásolva!");try{navigator.clipboard.writeText(box.value).then(done,()=>{box.select()})}catch(err){box.select()}break}
 case"speed":{const u=UNIT[UI.sel.games];if(u.words.filter(w=>w.p).length<4){toast("Ebben a fejezetben kevés a képes szó – válassz másikat!");return}startLesson({items:speedItems([u]),title:"Villámkör",mode:"speed"});break}
 case"memory":newMemory();break;case"mem":tapMem(+t.dataset.i);break;
 case"weak":{const ws=weakWords();if(ws.length<3){toast("Még nincs elég eltévesztett szó. Gyakorolj előbb!");return}startLesson({items:wordsLesson(ws),title:"Gyenge szavak",xp:12});break}
 case"examPractice":startLesson({items:examPractice(),title:"Unit 2 · gyors gyakorlás",xp:12});break;
 case"exNew":EX=makeExam();render();window.scrollTo(0,0);break;
 case"exPrint":offerFile("unit2-probadolgozat.html",examSheet(EX));break;
 case"exBlank":if(EX.graded)return;if(EX.ans[id]){delete EX.ans[id]}EX.active=id;render();break;
 case"exBank":{if(EX.graded)return;const v=t.dataset.v;const tgt=EX.active&&!EX.ans[EX.active]?EX.active:EX.items.find(i=>i.sec==="A"&&!EX.ans[i.id]);const tid=typeof tgt==="string"?tgt:tgt&&tgt.id;if(!tid)return;
  for(const k in EX.ans)if(k[0]==="a"&&EX.ans[k]===v)delete EX.ans[k];EX.ans[tid]=v;const nx=EX.items.find(i=>i.sec==="A"&&!EX.ans[i.id]);EX.active=nx?nx.id:null;beep("tap");render();break}
 case"exSeg":case"exPick":if(EX.graded)return;EX.ans[id]=t.dataset.v;beep("tap");render();break;
 case"exPic":if(EX.graded)return;EX.ans[id]=+t.dataset.v;beep("tap");render();break;
 case"exTok":{if(EX.graded)return;const arr=EX.ans[id]||(EX.ans[id]=[]);const i=+t.dataset.i;if(!arr.includes(i))arr.push(i);beep("tap");render();break}
 case"exUntok":if(EX.graded)return;(EX.ans[id]||[]).splice(+t.dataset.k,1);render();break;
 case"exGrade":gradeExam();break;
 case"copyCode":{const done=()=>toast("Kimásolva: "+cloud.code);try{navigator.clipboard.writeText(cloud.code).then(done,()=>toast(cloud.code))}catch(err){toast(cloud.code)}break}
 case"makeCode":S.updatedAt=Date.now();saveLocal();cloud.pending=true;flushSupa().then(()=>{if(cloud.code)openPlayers();else toast("Most nincs kapcsolat. Próbáld újra később!")});break;
 case"joinCode":joinFamily($("#joinCode").value);break;
 }});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="bkUnit"){UI.sel.shuffle=t.value;UI.bk.g="all";saveUI();render()}else if(t.id==="bkGroup"){UI.bk.g=t.value;saveUI();render()}else if(t.id==="bkN"){UI.bk.n=+t.value;saveUI()}else if(t.id==="bkS"){UI.bk.s=t.checked?1:0;saveUI()}});

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&$(".sheet-bg")){e.preventDefault();closeSheet();return}
 if($("#lesson").hidden||$(".sheet-bg"))return;
 if(e.key==="Enter"){if(!$("#lBtn").disabled&&!$("#lBtn").hidden){e.preventDefault();mainBtn()}return}
 if(e.target.id==="typeIn")return;
 if(L.state==="ask"&&Q&&/^[1-6]$/.test(e.key)){const b=$$(".opt",body())[+e.key-1];b&&!b.classList.contains("pair")&&b.click();return}
 if(L.state==="ask"&&Q&&Q.tiles&&/^[a-z]$/i.test(e.key)){const i=Q.tiles.findIndex(t=>!t.used&&t.ch.toLowerCase()===e.key.toLowerCase());if(i>=0)tapTile(i);return}
 if(L.state==="ask"&&Q&&Q.slots&&e.key==="Backspace"){for(let i=Q.slots.length-1;i>=0;i--)if(Q.slots[i]!=null){tapSlot(i);break}}});
if(synth&&synth.addEventListener)synth.addEventListener("voiceschanged",()=>{});

renderHeader();view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):"path";render();

if(!(C&&typeof C.use==="function"))initSupa();
if(C&&typeof C.use==="function"){C.use("tts").then(t=>{if(t){cloudTts=t;refreshSpeakers()}}).catch(()=>{});C.use("downloads").then(d=>{dl=d}).catch(()=>{});initCloud(C)}
})();
