<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gábor Béleczki · Applied AI in Finance</title>
    <meta name="description" content="Gábor Béleczki, AI Program Manager in Budapest: the portfolio as a page." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#faf9f5" />
    <style>
      /* The page view is the original portfolio, untouched (./original/), shown full screen.
         This wrapper only adds the way back into the 3D studio. */
      :root {
        --pill-bg: rgba(255, 255, 255, 0.78);
        --pill-ink: #1d1d1f;
        --pill-line: rgba(29, 29, 31, 0.1);
        --pill-shadow: 0 6px 24px rgba(29, 45, 61, 0.16), 0 1px 2px rgba(29, 45, 61, 0.08);
        --page-bg: #faf9f5;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --pill-bg: rgba(38, 38, 42, 0.78);
          --pill-ink: #f5f5f7;
          --pill-line: rgba(255, 255, 255, 0.12);
          --pill-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--page-bg);
        overflow: hidden;
      }
      .original {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--page-bg);
      }
      .studio-pill {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 15px 9px 12px;
        border-radius: 999px;
        border: 1px solid var(--pill-line);
        background: var(--pill-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        box-shadow: var(--pill-shadow);
        color: var(--pill-ink);
        font: 500 14px/1.2 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif;
        letter-spacing: -0.01em;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .studio-pill:hover {
        transform: translateY(-1px);
      }
      .studio-pill:focus-visible {
        outline: 2px solid #416180;
        outline-offset: 3px;
      }
      .studio-pill svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .note {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: calc(max(16px, env(safe-area-inset-bottom)) + 52px);
        z-index: 10;
        max-width: min(360px, calc(100vw - 32px));
        padding: 10px 14px;
        border-radius: 14px;
        background: var(--pill-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        box-shadow: var(--pill-shadow);
        color: var(--pill-ink);
        font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      }
      .note[hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .studio-pill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <iframe class="original" src="./original/" title="Gábor Béleczki · portfolio"></iframe>
    <a class="studio-pill" href="/?studio" data-studio>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 2.5 17 6.25v7.5L10 17.5 3 13.75v-7.5L10 2.5Z" />
        <path d="M3 6.25 10 10l7-3.75M10 10v7.5" />
      </svg>
      <span>3D studio</span>
    </a>
    <p class="note" role="status" hidden></p>
    <script>
      (function () {
        var pill = document.querySelector('[data-studio]');
        pill.addEventListener('click', function () {
          try {
            localStorage.setItem('gb-mode', 'studio');
          } catch (e) {}
        });
        // a word on why the page is shown, when the studio sent the visitor here
        var reason = /[?&]reason=([\w-]+)/.exec(location.search);
        var notes = {
          'studio-error': 'The 3D studio could not start on this device, so here is the page.',
          unsupported: 'This browser can’t run the 3D studio smoothly, so here is the page. You can still try it.',
        };
        var note = document.querySelector('.note');
        if (reason && notes[reason[1]]) {
          note.textContent = notes[reason[1]];
          note.hidden = false;
          setTimeout(function () {
            note.hidden = true;
          }, 6000);
        }
        // keep the tab title in step with the original page
        var frame = document.querySelector('.original');
        frame.addEventListener('load', function () {
          try {
            var t = frame.contentDocument && frame.contentDocument.title;
            if (t) document.title = t;
          } catch (e) {}
        });
      })();
    </script>
  </body>
</html>
