    <script>
      // Decide before first paint whether this browser gets the 3D studio or the static page.
      // Rules: WebGL 2 without a software fallback, enough memory, not a phone-sized touch screen,
      // no reduced-motion preference and no crawler. ?page / ?studio and a saved choice override.
      (function () {
        var d = document.documentElement;
        var q = location.search;
        var saved = null;
        try {
          saved = localStorage.getItem('gb-mode');
        } catch (e) {}
        var forcePage = /[?&]page(\b|=)/.test(q);
        var forceStudio = /[?&]studio(\b|=)/.test(q);
        var why = '';
        var ok = true;
        try {
          var c = document.createElement('canvas');
          var gl = c.getContext('webgl2', { failIfMajorPerformanceCaveat: true });
          if (!gl) {
            ok = false;
            why = 'webgl2';
          } else {
            var ext = gl.getExtension('WEBGL_debug_renderer_info');
            var r = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '';
            if (/swiftshader|llvmpipe|software/i.test(r)) {
              ok = false;
              why = 'software-gl';
            }
            var lose = gl.getExtension('WEBGL_lose_context');
            if (lose) lose.loseContext();
          }
        } catch (e) {
          ok = false;
          why = 'webgl2';
        }
        if (ok && navigator.deviceMemory && navigator.deviceMemory < 4) {
          ok = false;
          why = 'memory';
        }
        if (ok && Math.min(screen.width, screen.height) < 600 && matchMedia('(pointer: coarse)').matches) {
          ok = false;
          why = 'small-screen';
        }
        if (ok && matchMedia('(prefers-reduced-motion: reduce)').matches) {
          ok = false;
          why = 'reduced-motion';
        }
        if (ok && /bot|crawl|spider|slurp|lighthouse|headless|preview/i.test(navigator.userAgent)) {
          ok = false;
          why = 'crawler';
        }
        var mode = ok ? 'studio' : 'page';
        if (saved === 'page' || saved === 'studio') mode = saved;
        if (forcePage) mode = 'page';
        if (forceStudio) mode = 'studio';
        d.setAttribute('data-mode', mode);
        if (mode === 'studio') {
          // start fetching the 3D room while the page boots
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'fetch';
          l.href = '/models/studio.glb';
          l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        }
        d.setAttribute('data-studio-support', ok ? 'yes' : 'no');
        if (why) d.setAttribute('data-studio-why', why);
      })();
    </script>
  </head>

    </main>

    <script type="module" src="/src/site/main.ts"></script>
  </body>
